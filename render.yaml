services:
  # Production Web Service
  - type: web
    name: mtc-bot
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --worker-class gthread --threads 4 --workers 2 --timeout 120 --keep-alive 5 --preload --bind 0.0.0.0:$PORT main:app"
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"

  - type: worker
    name: mtc-cleanup
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -c \"import time; [time.sleep(3600) for _ in iter(int, 1)]\""