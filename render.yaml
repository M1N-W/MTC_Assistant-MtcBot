services:
  # Production Web Service
  - type: web
    name: mtc-bot
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "PYTHONPATH=src gunicorn --worker-class gthread --threads 4 --workers 2 --timeout 120 --keep-alive 5 --bind 0.0.0.0:$PORT mtc_assistant.main:app"
    healthCheckPath: /healthz
    autoDeploy: true

    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: MTC_DASHBOARD_API_TOKEN
        sync: false
      - key: DASHBOARD_ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_CREDENTIALS_BASE64
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false

  - type: worker
    name: mtc-cleanup
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -c \"import time; [time.sleep(3600) for _ in iter(int, 1)]\""

  - type: web
    name: mtc-dashboard
    env: node
    plan: starter
    rootDir: dashboard
    buildCommand: "npm ci --include=dev && npm run build"
    startCommand: "npm run start"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: MTC_BOT_API_BASE_URL
        sync: false
      - key: MTC_DASHBOARD_API_TOKEN
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        sync: false
