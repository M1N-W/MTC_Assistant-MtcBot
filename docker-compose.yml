services:
  mtc-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mtc-assistant
    env_file:
      - .env
    environment:
      PORT: "5000"
      FLASK_DEBUG: "false"
    ports:
      - "5001:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
